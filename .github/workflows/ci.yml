# Tests every pull request, once per push to it: compiles planex2d as the installation page describes, in the three
# installs of publish.yml (with NGSolve and the optional packages, with netgen alone, without netgen) on the oldest and
# the newest Python planex2d supports, on Linux (GCC) and Windows (MSVC), and the wasm32 wheel for Pyodide, and runs the
# whole test suite on the pull request merged into its target. Only
# pull requests: main is protected, so every change reaches it through one, and a push to main would only repeat the
# test. The type stub is tested as it is committed (tests/test_stubs.py fails when it is out of date: python
# tools/stubgen.py writes it). Nothing is published here; releases go through publish.yml. A newer push to the same pull
# request cancels the run still going.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        install: [full, netgen, core]
        python: ["3.11", "3.14"]
    # the Linux jobs keep their names
    name: test (${{ matrix.install }}, Python ${{ matrix.python }})${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # NGSolve before planex2d: it pins netgen-mesher to its own version, which planex2d is then compiled against
      - name: Install, as the installation page describes
        run: |
          case "${{ matrix.install }}" in
            full) python -m pip install ngsolve netgen-mesher netgen-occt-devel scikit-build-core "pybind11>=3.1,<3.2"
                  python -m pip install --no-build-isolation . ;;
            netgen) python -m pip install netgen-mesher netgen-occt-devel scikit-build-core "pybind11>=3.1,<3.2"
                    python -m pip install --no-build-isolation . ;;
            core) python -m pip install . ;;
          esac
      # gmsh (its wheel needs X11) and dolfinx (no pip package) are not installed, and their tests skip
      - name: The test suite
        run: |
          python -m pip install pytest hypothesis
          if [ "${{ matrix.install }}" = full ]; then
            python -m pip install numpy scipy shapely ezdxf matplotlib plotly svgelements
          fi
          python -m pytest tests -q

  # planex in the browser: the wasm32 wheel from this checkout for the Pyodide versions publish.yml publishes, 0.29
  # (Python 3.13) and 314 (Python 3.14), and the whole suite in Pyodide under Node.js; the tests that start a subprocess
  # skip there
  pyodide:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    name: pyodide (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      # cibuildwheel builds for Pyodide with a Python of the same version
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel and run the suite in Pyodide
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: "cp${{ matrix.python == '3.13' && '313' || '314' }}-*"
          CIBW_CONFIG_SETTINGS: cmake.define.PLANEX_OCC=OFF
          CIBW_TEST_REQUIRES: pytest hypothesis
          CIBW_TEST_COMMAND: python -m pytest {project}/tests -q -p no:cacheprovider
        run: |
          python -m pip install "cibuildwheel>=4.1.1,<5"
          python -m cibuildwheel . --output-dir wheelhouse
