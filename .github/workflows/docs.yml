# Publishes the site (the root page, which sends visitors on to the built documentation under docs/) to GitHub Pages.
# The site is not in this repository: it is the asset site.zip of a GitHub release, its files at the zip's root
# (index.html, robots.txt, docs/...). This workflow runs when a release is published and when run by hand with a tag;
# it downloads that release's site.zip, unpacks it and publishes the folder as it is. A docs update between releases
# replaces the asset (gh release upload vX.Y.Z site.zip --clobber) and runs this workflow by hand with the tag.
#
# Once, before the first run: in this repository's settings, Pages > Build and deployment > Source: "GitHub Actions",
# and the custom domain planex2d.org (with its DNS records). A release run deploys from its tag, so the environment
# github-pages needs a deployment rule for tags (Settings > Environments > github-pages: Ref type Tag, pattern v*).
name: docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release whose site.zip to publish (vX.Y.Z)"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: The site from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern site.zip
          mkdir site
          unzip -q site.zip -d site
          test -f site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
