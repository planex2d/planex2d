# A release is a published GitHub release with a tag such as v0.1.0. This workflow then writes the tag's version
# (0.1.0) into pyproject.toml, builds planex2d's sdist with the type stub written from the module compiled from this
# checkout (tools/stubgen.py, so that the stub cannot be forgotten), checks it (the version, the license files, no
# Netgen submodule), installs it on a clean runner as the installation page describes, with NGSolve and the optional
# packages, runs a smoke test and the whole test suite of the sdist, publishes it to TestPyPI and, after approval in
# the "pypi" environment, to PyPI. A failing check or test stops the run before anything is published: each publish
# job needs the one before it to succeed.
#
# Run by hand (Actions > publish > Run workflow), it builds and tests the sdist and publishes only to the target chosen
# ("none", "testpypi", or "pypi" through TestPyPI). The version: the one typed in, else the tag's when the run is on a
# tag ("Use workflow from" a tag vX.Y.Z), else the one in pyproject.toml, which a run that publishes refuses. TestPyPI
# and PyPI accept each version only once (a file name is never reused, not even after deleting it), so a trial run to
# TestPyPI needs a version of its own, e.g. 0.1.0rc1. A version already on TestPyPI is skipped there, so that a
# release whose PyPI step was not approved can still go to PyPI later: run this by hand from its tag, target "pypi".
#
# Publishing uses PyPI's trusted publishing, without an API token. Once, before the first release:
# - on https://pypi.org and https://test.pypi.org: add a trusted publisher for this repository with the workflow file
#   publish.yml and the environment "pypi" (PyPI) or "testpypi" (TestPyPI);
# - in this repository's settings: create the environments "testpypi" and "pypi", the latter with a required reviewer.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish the tested sdist to"
        type: choice
        options: [none, testpypi, pypi]
        default: none
      version:
        description: "Version (empty: the one in pyproject.toml)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The version
        env:
          VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name || '') }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.target != 'none' }}
        run: |
          if [ -n "$VERSION" ]; then
            sed -i "s/^version = \".*\"/version = \"${VERSION#v}\"/" pyproject.toml
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::a run that publishes needs a version: run it from a tag vX.Y.Z or type the version"
            exit 1
          fi
          grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/' > version.txt
          echo "planex2d $(cat version.txt)"
      # NGSolve first, as in the test job: both compile against the netgen it pins, so the stub written here is the one
      # the test job checks against
      - name: Write the type stub from the built module
        run: |
          python -m pip install ngsolve netgen-mesher netgen-occt-devel scikit-build-core
          python -m pip install --no-build-isolation .
          python tools/stubgen.py
          git diff --quiet -- src/python/planex/_planex.pyi \
            || echo "::warning::the committed type stub was out of date; the sdist gets the one written now"
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Check the sdist
        run: |
          ls -l dist
          test -f "dist/planex2d-$(cat version.txt).tar.gz" || { echo "the sdist does not carry the version $(cat version.txt)"; exit 1; }
          tar tzf dist/*.tar.gz > files.txt
          for f in pyproject.toml CMakeLists.txt LICENSE THIRD_PARTY_NOTICES.md README.md \
                   external_dependencies/eigen/COPYING.MPL2 external_dependencies/eigen/COPYING.APACHE \
                   external_dependencies/eigen/COPYING.BSD external_dependencies/taskflow/LICENSE; do
            grep -q "^[^/]*/$f$" files.txt || { echo "missing in the sdist: $f"; exit 1; }
          done
          if grep -q "external_dependencies/netgen/" files.txt; then echo "the Netgen submodule is in the sdist"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # NGSolve before planex2d: it pins netgen-mesher to its own version, which planex2d is then compiled against
      - name: Install from the sdist, as the installation page describes, with NGSolve
        run: |
          python -m pip install ngsolve netgen-mesher netgen-occt-devel scikit-build-core
          python -m pip install --no-build-isolation dist/*.tar.gz
      - name: Smoke test
        run: |
          python -c "
          import planex as px
          face = px.QuickSketch().Rectangle(2, 1).Face()
          assert abs(face.mass - 2) < 1e-12, face.mass
          print('planex2d imported, a 2 x 1 rectangle has the area', face.mass)
          "
      # the whole suite of the sdist, the type stub's check included; gmsh (its wheel needs X11) and dolfinx (no pip
      # package) are not installed, and their tests skip
      - name: The test suite, with the optional packages
        run: |
          mkdir unpacked && tar xzf dist/*.tar.gz -C unpacked --strip-components=1
          python -m pip install pytest hypothesis numpy scipy shapely ezdxf matplotlib plotly
          python -m pytest unpacked/tests -q

  testpypi:
    needs: test
    if: github.event_name == 'release' || inputs.target != 'none'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
